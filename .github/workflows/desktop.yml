name: Build native desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    # The Swift shell currently targets arm64; use the standard Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: npm ci
      - run: npm test
      - name: Build AppKit and WKWebView app
        run: bash scripts/build_macos.sh
      - name: Check packaged helper without polling
        run: '"artifacts/Token重置.app/Contents/Resources/monitor/TiboMonitorHelper" --once --help'
      - uses: actions/upload-artifact@v4
        with:
          name: token-reset-macOS-arm64
          path: artifacts/token-reset-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Test frontend data contract
        run: npm exec -- tsx --test tests/*.test.ts
      - run: npm run build
      - name: Build WPF and WebView2 app
        # This script runs Python tests and helper --help, without live polling or sending.
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Runtime win-x64 -SkipFrontend
      - uses: actions/upload-artifact@v4
        with:
          name: TiboMonitor-Windows-x64
          path: artifacts/TiboMonitor-win-x64.zip
          if-no-files-found: error
          retention-days: 7
